version: '3.8'

services:
  sige-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sige_shared_boilerplate_app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=sige-db
      - DB_PORT=5432
      - DB_NAME=sige_db
      - DB_USER=postgres
      - DB_PASS=sige_secure_pass_2026
    depends_on:
      sige-db:
        condition: service_healthy

  sige-db:
    image: postgres:16-alpine
    container_name: sige_shared_boilerplate_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=sige_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=sige_secure_pass_2026
    volumes:
      - sige_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sige_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sige_db_data:
    driver: local