# ===================================================================
# CONFIGURACIÓN GLOBAL / VALORES POR DEFECTO
# ===================================================================
spring:
  application:
    name: sige-backend-core
  profiles:
    active: dev # Si nadie especifica entorno, por defecto arranca en desarrollo
  jackson:
    default-property-inclusion: non_null
    serialization:
      write_dates_as_timestamps: false
x
server:
  port: ${PORT:8082}
  servlet:
    context-path: /api/v1

# Configuración de Seguridad para BP-12 y BP-19
app:
  security:
    jwt:
      secret: "${JWT_SECRET}"
    cors:
      # Permitimos localhost por defecto; en prod se puede sobreescribir con variable de entorno
      allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}"

# ===================================================================
# BP-04: CONTRATO DE OBSERVABILIDAD (SPRING BOOT ACTUATOR)
# ===================================================================
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true # Activa probes de Liveness y Readiness (para Docker/Kubernetes)
  health:
    db:
      enabled: true
    diskspace:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: "@project.name@"
    description: "SIGE UNSIS Backend Core Service"
    version: "@project.version@"
    java-version: "21"

---
# ===================================================================
# ENTORNO: DESARROLLO (LOCAL)
# ===================================================================
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sige_db}?currentSchema=public
    # sige_users
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
    cache:
      type: redis
      redis:
        time-to-live: 3600000 # TTL por defecto: 1 hora (en ms)
        cache-null-values: false

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
  packages-to-scan: mx.edu.unsis.sige

---
# ===================================================================
# ENTORNO: PRODUCCIÓN (SERVIDORES INSTITUCIONALES UNSIS)
# ===================================================================
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate # Jamás modificar la estructura de producción automáticamente
    show-sql: false
    properties:
      hibernate:
        format_sql: false
